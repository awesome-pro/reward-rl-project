[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rewardforge"
version = "0.1.0"
description = "Cost-controlled, adaptive executable-reward verification for code-generation RL"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "RewardForge" }]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rewardforge = "rewardforge.cli:main"

[tool.setuptools.packages.find]
include = ["rewardforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
